<!doctype html>
<!--
  Play 기능 그래픽(1024x500) 원본. 브라우저로 열어 1024x500으로 캡처한다.
  작품 포스터는 쓰지 않는다. 스토어 스크린샷과 달리 이 그림은 앱 화면이 아니라
  만들어 배포하는 홍보 자료라, 권리 문제를 피해 앱의 색과 모양만 쓴다.
  색은 lib/src/core/theme/theme.dart 의 matcha 팔레트 값이다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #12140E;
    --card: #1A1C14;
    --ink: #F0F0E0;
    --muted: #94A468;
    --mint: #5AB898;
    --gold: #E0A04A;
    --line: #3E481D;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px; height: 500px; overflow: hidden;
    background: var(--bg);
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    display: flex; align-items: center;
    position: relative;
  }
  /* 앱 배경의 번짐을 그대로 옮긴다 */
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .glow.a { width: 420px; height: 420px; background: var(--mint); opacity: .16; left: -90px; top: -140px; }
  .glow.b { width: 380px; height: 380px; background: var(--gold); opacity: .10; right: 120px; bottom: -160px; }

  .left { padding: 0 0 0 68px; width: 560px; position: relative; z-index: 2; }
  .title { font-size: 62px; font-weight: 900; color: var(--ink); letter-spacing: -2.5px; line-height: 1.02; }
  .sub { margin-top: 20px; font-size: 25px; font-weight: 700; color: var(--ink); line-height: 1.42; letter-spacing: -.6px; }
  .sub b { color: var(--mint); font-weight: 900; }
  .tags { margin-top: 26px; display: flex; gap: 9px; }
  .tag {
    padding: 9px 17px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
    font-size: 16px; font-weight: 800;
  }

  /* 오른쪽: 앱 카드 모양(42px 모서리)만 흉내낸다. 포스터는 넣지 않는다. */
  .right { position: absolute; right: 56px; top: 50%; transform: translateY(-50%); z-index: 2; }
  .card {
    width: 300px; background: var(--card);
    border: 1px solid var(--line); border-radius: 42px;
    padding: 26px 28px 28px; box-shadow: 0 18px 44px rgba(0,0,0,.55);
  }
  .card .label { font-size: 15px; font-weight: 900; color: var(--mint); letter-spacing: -.3px; }
  .card .name { margin-top: 10px; font-size: 31px; font-weight: 900; color: var(--ink); letter-spacing: -1.2px; }
  .card .meta { margin-top: 9px; font-size: 16px; color: var(--muted); font-weight: 600; }
  .bar { margin-top: 17px; height: 6px; border-radius: 999px; background: #2A3320; overflow: hidden; }
  .bar i { display: block; width: 68%; height: 100%; border-radius: 999px;
           background: linear-gradient(90deg, #8FD8C4, var(--mint)); }
  .where { margin-top: 22px; font-size: 14px; font-weight: 900; color: var(--ink); }
  .ott { margin-top: 11px; display: flex; flex-wrap: wrap; gap: 7px; }
  .ott span {
    padding: 7px 13px; border-radius: 999px;
    border: 1px solid var(--line); background: #1E2016;
    font-size: 14px; font-weight: 800; color: var(--ink);
  }
</style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>

  <div class="left">
    <div class="title">애니 체크</div>
    <div class="sub">
      어디까지 봤는지 기록하고,<br>
      <b>지금 어디서 볼 수 있는지</b>까지.
    </div>
    <div class="tags">
      <div class="tag">광고 없음</div>
      <div class="tag">가입 없음</div>
      <div class="tag">무료</div>
    </div>
  </div>

  <div class="right">
    <div class="card">
      <div class="label">지금 이어볼 차례</div>
      <div class="name">시즌 2 · 17화</div>
      <div class="meta">40/59화 · 68%</div>
      <div class="bar"><i></i></div>
      <div class="where">지금 볼 수 있는 곳</div>
      <div class="ott">
        <span>넷플릭스</span><span>티빙</span><span>웨이브</span>
      </div>
    </div>
  </div>
</body>
</html>
